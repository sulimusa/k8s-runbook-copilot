name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.11", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.13.9", enable-cache: true }
      - run: uv sync --locked --all-extras --python "${{ matrix.python }}"
      - name: Use the locked environment
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: ruff check src app eval tests observability scripts
      - run: pytest -q
      - run: python scripts/check_demo.py
      - name: Validate evidence-first incident fixtures (offline)
        run: |
          python -m eval.incident_eval validate
          python -m eval.incident_eval review-status
      - name: Static analysis and dependency audit
        run: |
          bandit -q -r src app eval -x tests
          pip-audit --local --skip-editable
      - name: Build corpus and run the retrieval eval gate (no LLM needed)
        run: |
          make ingest
          python -m eval.run_eval --mode retrieval --min-hit5 0.9
      - name: Dashboard JSON is up to date
        run: |
          python observability/build_dashboard.py
          git diff --exit-code observability/dashboards/copilot.json observability/dashboards/atlas.json

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint (dev and prod values)
        run: |
          helm lint deploy/helm/runbook-copilot -f deploy/helm/runbook-copilot/values-dev.yaml
          helm lint deploy/helm/runbook-copilot -f deploy/helm/runbook-copilot/values-prod.yaml
      - name: Render and validate against the Kubernetes schemas
        run: |
          for v in dev prod; do
            helm template copilot deploy/helm/runbook-copilot -n "$v" -f "deploy/helm/runbook-copilot/values-$v.yaml" \
              | docker run -i --rm ghcr.io/yannh/kubeconform:latest -strict -summary -
          done

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy misconfiguration scan (Dockerfile + Helm chart; the lab-only manifest in deploy/k8s is excluded)
        run: |
          docker run --rm -v "$PWD:/w" -w /w aquasec/trivy:0.75.0 config \
            --ignorefile .trivyignore --exit-code 1 --severity MEDIUM,HIGH,CRITICAL \
            --helm-values deploy/helm/runbook-copilot/values-prod.yaml deploy/helm/runbook-copilot
          docker run --rm -v "$PWD:/w" -w /w aquasec/trivy:0.75.0 config \
            --ignorefile .trivyignore --exit-code 1 --severity MEDIUM,HIGH,CRITICAL Dockerfile
      - name: Trivy scan of the agent RBAC (writer-role findings accepted per file, see .trivyignore.yaml)
        run: |
          docker run --rm -v "$PWD:/w" -w /w aquasec/trivy:0.75.0 config \
            --ignorefile .trivyignore.yaml --exit-code 1 --severity MEDIUM,HIGH,CRITICAL deploy/rbac

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the no-key demo image
        run: docker build -f Dockerfile.demo -t runbook-demo .
      - name: Verify loopback health without credentials or a cluster
        run: |
          docker run -d --name runbook-demo -p 127.0.0.1:18501:8501 runbook-demo
          for n in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18501/_stcore/health; then exit 0; fi
            sleep 2
          done
          docker logs runbook-demo
          exit 1
      - if: always()
        run: docker rm -f runbook-demo || true
