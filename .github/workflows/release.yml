# Build ONCE. The immutable tag produced here is what dev runs and what promote.yml later retags for prod.
name: release
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[api,otel,dev]"
      - run: pytest -q
      - name: Retrieval eval gate
        run: |
          make ingest
          python -m eval.run_eval --mode retrieval --min-hit5 0.9

  build:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          TAG="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"   # GHCR requires lowercase
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the pushed image (fail on fixable HIGH/CRITICAL)
        run: |
          docker run --rm -e TRIVY_USERNAME="${{ github.actor }}" -e TRIVY_PASSWORD="${{ secrets.GITHUB_TOKEN }}" \
            aquasec/trivy:0.75.0 image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
      - name: Summary
        run: |
          {
            echo "### Built \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`"
            echo "Deploy this tag to dev, then promote it with the **promote** workflow (retag, no rebuild)."
          } >> "$GITHUB_STEP_SUMMARY"
