apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "runbook-copilot.fullname" . }}
  labels:
    {{- include "runbook-copilot.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.environment | quote }}
  APP_VERSION: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
  LLM_BASE_URL: {{ .Values.llm.baseUrl | quote }}
  LLM_MODEL: {{ .Values.llm.model | quote }}
  TOP_K: {{ .Values.retrieval.topK | quote }}
  MIN_BM25_SCORE: {{ .Values.retrieval.minBm25Score | quote }}
  MIN_QUERY_COVERAGE: {{ .Values.retrieval.minQueryCoverage | quote }}
  STRONG_MATCH_SCORE: {{ .Values.retrieval.strongMatchScore | quote }}
  MIN_CONFIDENCE: {{ .Values.retrieval.minConfidence | quote }}
  OTEL_ENABLED: {{ .Values.otel.enabled | quote }}
  {{- if .Values.otel.enabled }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ required "otel.endpoint is required when otel.enabled=true" .Values.otel.endpoint | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ .Values.otel.protocol | quote }}
  {{- end }}
  {{- if .Values.llm.priceInPer1M }}
  LLM_PRICE_IN_PER_1M: {{ .Values.llm.priceInPer1M | quote }}
  {{- end }}
  {{- if .Values.llm.priceOutPer1M }}
  LLM_PRICE_OUT_PER_1M: {{ .Values.llm.priceOutPer1M | quote }}
  {{- end }}
