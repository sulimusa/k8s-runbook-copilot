{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "runbook-copilot.fullname" . }}
  labels:
    {{- include "runbook-copilot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "runbook-copilot.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 8000
          protocol: TCP
      from:
        {{- if .Values.networkPolicy.ingressFrom }}
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
  egress:
    {{- if .Values.networkPolicy.allowDns }}
    - ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    {{- end }}
    {{- if .Values.networkPolicy.allowHttps }}
    - ports:
        - { port: 443, protocol: TCP }
    {{- end }}
    {{- if .Values.otel.enabled }}
    - ports:
        - { port: {{ .Values.networkPolicy.otlpPort }}, protocol: TCP }
    {{- end }}
{{- end }}
