apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web
spec:
  replicas: 1
  selector:
    matchLabels: {app: demo-web}
  template:
    metadata:
      labels: {app: demo-web, version: stable}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: nginx:1.28-alpine
          ports: [{containerPort: 80}]
          resources:
            requests: {cpu: 20m, memory: 24Mi}
            limits: {cpu: 200m, memory: 96Mi}
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: demo-web
spec:
  selector: {app: demo-web}
  ports: [{port: 80, targetPort: 80}]
