# Lab-only observability backend: Grafana's all-in-one OpenTelemetry stack (collector, Prometheus, Loki, Tempo, Grafana).
# Not hardened on purpose (the upstream image is built for local use). Do not expose it outside the lab.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  namespace: observability
  labels: { app.kubernetes.io/name: lgtm }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: lgtm }
  template:
    metadata:
      labels: { app.kubernetes.io/name: lgtm }
    spec:
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:latest   # pin a version tag before relying on this
          ports:
            - { name: grafana, containerPort: 3000 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          resources:
            requests: { cpu: 200m, memory: 768Mi }
            limits: { memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: lgtm
  namespace: observability
spec:
  selector: { app.kubernetes.io/name: lgtm }
  ports:
    - { name: grafana, port: 3000, targetPort: grafana }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
