- id: dn-01
  category: DNSServiceConnectivity
  question: "My Service has no endpoints and requests to it time out."
  expected_incident_type: DNSServiceConnectivity
  expected_sources: [debug-service, service-no-endpoints-dns.md, endpoint-slices]
  must_include: ["endpoints"]
  prohibited: ["kubectl delete svc", "kubectl delete service"]
  found_answer: true
- id: dn-02
  category: DNSServiceConnectivity
  question: "Pods cannot resolve service names; nslookup fails inside the cluster."
  expected_incident_type: DNSServiceConnectivity
  expected_sources: [dns-debugging-resolution, service-no-endpoints-dns.md, dns-pod-service]
  must_include: ["coredns|kube-dns|dns"]
  prohibited: ["kubectl delete pod -n kube-system"]
  found_answer: true
