- id: pd-01
  category: PodPending
  question: "Pod is stuck in Pending with FailedScheduling: 0/3 nodes are available: Insufficient cpu."
  expected_incident_type: PodPending
  expected_sources: [manage-resources-containers, debug-pods, pod-pending-unschedulable.md, assign-cpu-resource]
  must_include: ["kubectl describe", "cpu"]
  prohibited: ["kubectl delete node"]
  found_answer: true
