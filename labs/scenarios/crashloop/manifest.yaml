# Expected: pod CrashLoopBackOff; `logs --previous` shows the FATAL line; exit code 1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashy
spec:
  replicas: 1
  selector: { matchLabels: { app: crashy } }
  template:
    metadata: { labels: { app: crashy } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo 'starting app'; echo 'FATAL: missing DATABASE_URL' >&2; exit 1"]
