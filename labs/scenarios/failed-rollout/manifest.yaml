# Step 1 (this file): healthy v1.  Step 2 (update.yaml): bad image -> rollout stalls, ProgressDeadlineExceeded.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
spec:
  replicas: 2
  progressDeadlineSeconds: 30
  selector: { matchLabels: { app: shop } }
  template:
    metadata: { labels: { app: shop } }
    spec:
      containers:
        - name: web
          image: nginx:1.27
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 3
