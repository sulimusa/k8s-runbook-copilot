# Expected:
#   readiness-bad -> Running but READY 0/1 ("Readiness probe failed: connection refused" on :8080)
#   liveness-bad  -> restarts ("Liveness probe failed: HTTP probe failed with statuscode: 404")
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readiness-bad
spec:
  replicas: 1
  selector: { matchLabels: { app: readiness-bad } }
  template:
    metadata: { labels: { app: readiness-bad } }
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: liveness-bad
spec:
  replicas: 1
  selector: { matchLabels: { app: liveness-bad } }
  template:
    metadata: { labels: { app: liveness-bad } }
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 2
