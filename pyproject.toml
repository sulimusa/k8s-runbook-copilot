[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runbook-copilot"
version = "0.1.0"
description = "Read-only, retrieval-grounded Kubernetes incident triage assistant built on public data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "openai>=1.30",
  "python-dotenv>=1.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
ui = ["streamlit>=1.33"]
app = ["runbook-copilot[api,ui]"]
otel = [
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4", "bandit>=1.7", "pip-audit>=2.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
